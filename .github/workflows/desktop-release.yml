name: Build and verify release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: desktop-release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  desktop:
    name: Package and verify (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            target: win
          - os: ubuntu-latest
            platform: linux
            target: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.9'
          cache: pip
          cache-dependency-path: scripts/requirements-build.txt
      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          python -m pip install -r scripts/requirements-build.txt
      - name: Prepare Linux display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Validate release and source
        run: |
          npm run changelog:check
          npm run check
          npm test
          python -m unittest discover -s backend -p 'test_*.py'
      - name: Build standalone codecs and video encoder
        run: |
          npm run build:frame-scan
          if [ "$RUNNER_OS" = Windows ]; then npm run build:vfw; fi
          npm run build:sidecar
          npm run verify:sidecar
          npm run build:video-encoder
      - name: Package the release
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          npm run dist:${{ matrix.target }} -- --x64 --publish never "--config.directories.output=release/$version"
          npm run release:verify -- "release/$version" --platform=${{ matrix.platform }}
          if [ "$RUNNER_OS" = Windows ]; then
            echo "STYK_PACKAGED_RESOURCES=$GITHUB_WORKSPACE/release/$version/win-unpacked/resources" >> "$GITHUB_ENV"
            echo "STYK_PACKAGED_EXECUTABLE=$GITHUB_WORKSPACE/release/$version/win-unpacked/StykAnimate-Max.exe" >> "$GITHUB_ENV"
          else
            echo "STYK_PACKAGED_RESOURCES=$GITHUB_WORKSPACE/release/$version/linux-unpacked/resources" >> "$GITHUB_ENV"
            echo "STYK_PACKAGED_EXECUTABLE=$GITHUB_WORKSPACE/release/$version/linux-unpacked/stykanimate-max" >> "$GITHUB_ENV"
          fi
      - name: Verify exact packaged files and desktop behavior
        run: |
          npm run verify:package
          if [ "$RUNNER_OS" = Linux ]; then display=(xvfb-run -a); else display=(); fi
          "${display[@]}" npm run test:boot:packaged
          "${display[@]}" npm run test:export:packaged
          "${display[@]}" npm run test:updates:desktop
          if [ "$RUNNER_OS" = Linux ]; then
            version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
            STYK_PACKAGED_EXECUTABLE="$GITHUB_WORKSPACE/release/$version/StykAnimate-Max-$version-linux-x86_64.AppImage" xvfb-run -a npm run test:boot:packaged
          fi
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: |
            release/${{ env.RELEASE_VERSION }}/*.exe
            release/${{ env.RELEASE_VERSION }}/*.blockmap
            release/${{ env.RELEASE_VERSION }}/*.AppImage
          retention-days: 30
          if-no-files-found: error
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ matrix.platform }}
          path: |
            artifacts/sidecar-smoke.json
            artifacts/package-manifest.json
          retention-days: 30
  web:
    uses: ./.github/workflows/web-verify.yml
